name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — a PR only needs its newest commit checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Non-blocking for now: `main` currently carries ~946 lint errors, almost
      # all Prettier formatting. Flip `continue-on-error` off once those are
      # cleared so lint regressions start failing the build.
      - name: Lint
        run: npx eslint .
        continue-on-error: true

      - name: Build
        run: npm run build
