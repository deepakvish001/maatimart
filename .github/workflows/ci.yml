name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — a PR only needs its newest commit checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo's lockfile is bun.lock, so the toolchain here is bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # Blocking as of #7: main is at 0 lint errors. Prettier runs as an ESLint
      # rule here, so this also catches formatting drift.
      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
